name: '🔧 Task'
description: 설정, 문서, CI, 의존성 등 기타 작업
title: '[Task] '
body:
  - type: textarea
    id: description
    attributes:
      label: 작업 내용
      description: 어떤 작업을 진행하는지 간단히 적어주세요.
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 작업 목록
      description: 세부 작업을 체크리스트로 적어주세요.
      value: |
        - [ ]
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: 참고 사항
      description: 관련 링크, 논의 사항 등이 있으면 적어주세요.
    validations:
      required: false
