name: '♻️ Refactor'
description: 기능 변경 없는 코드 구조 개선
title: '[Refactor] '
body:
  - type: textarea
    id: target
    attributes:
      label: 리팩토링 대상
      description: 어떤 파일/컴포넌트/모듈을 대상으로 하는지 적어주세요.
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 작업 내용
      description: 변경할 내용을 체크리스트로 적어주세요.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: effect
    attributes:
      label: 기대 효과
      description: 리팩토링 후 기대되는 효과를 적어주세요.
    validations:
      required: false
