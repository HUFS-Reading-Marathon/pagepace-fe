name: '🐛 Fix'
description: 버그 수정
title: '[Fix] '
body:
  - type: textarea
    id: problem
    attributes:
      label: 문제 상황
      description: 어떤 문제가 발생했는지, 재현 방법이 있다면 함께 적어주세요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 정상적으로 동작한다면 어떻게 되어야 하는지 적어주세요.
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 작업 내용
      description: 수정할 내용을 체크리스트로 적어주세요.
      value: |
        - [ ]
    validations:
      required: false
