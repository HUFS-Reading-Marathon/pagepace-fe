name: Deploy Frontend

on:
  push:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy frontend via SSH
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          command_timeout: 20m

          script: |
            set -e

            echo "Pull latest frontend source"

            cd ~/projects/pagepace-fe
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            git log -1 --format="Deploying %h %s"


            echo "Rebuild and restart only the frontend container"

            cd ~/projects/pagepace-deploy

            docker compose up -d --build --no-deps frontend


            echo "Restart nginx so it resolves the new frontend container"

            docker restart pagepace-nginx || true


            echo "Remove unused docker images"

            docker image prune -f


            echo "Docker compose status"

            docker compose ps
